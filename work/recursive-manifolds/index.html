    <title>The Recursive Manifold Hypothesis | Axym Labs</title>
    <meta name="description" content="Many real-world distributions are organized at more than one resolution, with broad categories capturing what their subcategories share and finer categories adding variation that remains organized within each parent. The recursive manifold hypothesis states this organization, and an energy-distance test that fits no model finds, in 13 of 14 image, text, and spiking-speech relation–representation pairs, that the finer categories add variation which their parents organize better than random groupings of the same sizes. These results suggest objectives and models that respect the hierarchical organization in data." />
